<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | default: '' | strip_html | normalize_whitespace | truncate: 160 | escape }}">
  <link rel="icon" type="image/png" sizes="512x512" href="{{ '/assets/images/favicon.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/images/favicon.png' | relative_url }}">
  {% if page.redirect_to %}<meta http-equiv="refresh" content="0; url={{ page.redirect_to }}">{% endif %}
  <style>
    /* subtle purple gradient wash behind everything */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(ellipse 60% 50% at 5% 10%,  rgba(100, 70, 220, 0.18) 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 95% 85%, rgba(120, 60, 210, 0.14) 0%, transparent 70%);
      pointer-events: none;
    }
  </style>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.65;
      color: #111;
      background: #fff;
      margin: 0;
      padding: 0;
    }

    .page-wrap {
      max-width: 680px;
      margin: 0 auto;
      padding: 3rem 1.25rem 5rem;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin: 0 0 0.2rem;
      color: #000;
      letter-spacing: -0.02em;
    }

    h2 {
      font-size: 0.95rem;
      font-weight: 700;
      margin: 0 0 0.75rem;
      color: #5a3adc;
      text-transform: lowercase;
      letter-spacing: 0.01em;
    }

    p { margin: 0.6rem 0; color: #444; }

    a { color: #0066cc; text-decoration: none; }
    a:hover { text-decoration: underline; }

    hr {
      border: none;
      border-top: 1px solid #eaeaea;
      margin: 2.25rem 0;
    }

    ul {
      margin: 0.4rem 0;
      padding-left: 1.2rem;
      color: #444;
    }

    li { margin: 0.35rem 0; }

    strong { color: #111; }

    /* Links row */
    .links {
      font-size: 0.88rem;
      margin-bottom: 2rem;
      color: #888;
    }

    .links a { color: #0066cc; }
    .links .sep { margin: 0 0.4rem; color: #ddd; }

    /* Profile block with photo */
    .profile {
      display: flex;
      gap: 1.5rem;
      align-items: flex-start;
      margin-bottom: 0.5rem;
    }

    .profile img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 6px;
      flex-shrink: 0;
    }

    .profile p:first-child { margin-top: 0; }

    /* Timeline entries */
    .entry {
      display: flex;
      gap: 1.25rem;
      margin-bottom: 1.25rem;
      align-items: flex-start;
    }

    .entry-period {
      font-size: 0.78rem;
      font-weight: 600;
      color: #bbb;
      width: 90px;
      flex-shrink: 0;
      padding-top: 0.15rem;
    }

    .entry-body { flex: 1; }

    .entry-title { font-weight: 600; color: #111; }
    .entry-sub { color: #666; font-size: 0.92rem; }

    .entry-logo {
      display: inline-block;
      height: 18px;
      width: auto;
      vertical-align: middle;
      margin-right: 0.4rem;
      object-fit: contain;
      filter: grayscale(30%);
      opacity: 0.85;
    }

    .entry-detail {
      margin-top: 0.35rem;
      font-size: 0.9rem;
      color: #555;
    }

    .entry-detail ul { margin: 0.3rem 0; padding-left: 1.1rem; }
    .entry-detail li { margin: 0.25rem 0; }

    /* Publications */
    .pub {
      margin-bottom: 0.8rem;
      font-size: 0.91rem;
      color: #444;
      line-height: 1.5;
    }

    .pub-venue {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 700;
      color: #666;
      background: #f2f2f2;
      padding: 0.1rem 0.4rem;
      border-radius: 3px;
      margin-right: 0.3rem;
      vertical-align: middle;
    }

    /* Back link for sub-pages */
    .back {
      font-size: 0.88rem;
      color: #888;
      margin-bottom: 2rem;
      display: block;
    }

    /* Footer */
    .page-footer {
      color: #ccc;
      font-size: 0.8rem;
      margin-top: 2.5rem;
      border-top: 1px solid #f5f5f5;
      padding-top: 1.25rem;
    }

    @media (max-width: 500px) {
      .profile { flex-direction: column; }
      .profile img { width: 75px; height: 75px; }
      h1 { font-size: 1.4rem; }
      .entry { flex-direction: column; gap: 0.15rem; }
      .entry-period { width: auto; }
    }
  </style>
</head>
<body>
<div class="page-wrap">
  {{ content }}
</div>
<canvas id="bg-canvas" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;pointer-events:none;"></canvas>

.x>cL&&p.x<cR){var m=(cL+cR)/2;if(p.x<m){p.x=cL;p.vx=-Math.abs(p.vx);}else{p.x=cR;p.vx=Math.abs(p.vx);}}}function sk(){if(!ps.length)return;ps[Math.floor(Math.random()*ps.length)].actAt=Date.now();setTimeout(sk,900+Math.random()*400);}function fr(){cx.clearRect(0,0,W,H);var t=Date.now()*0.001,now=Date.now();for(var i=0;i<ps.length;i++){var a=ps[i];for(var j=i+1;j<ps.length;j++){var b=ps[j],dx=a.x-b.x,dy=a.y-b.y,d=Math.sqrt(dx*dx+dy*dy);if(d<MD){cx.beginPath();cx.strokeStyle='rgba('+C+','+(0.25*(1-d/MD))+')';cx.lineWidth=0.8;cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y);cx.stroke();}}}for(var i=0;i<ps.length;i++){var p=ps[i],el=p.actAt>0?now-p.actAt:FM,t01=Math.max(0,1-el/FM),pr=p.r+Math.sin(t*1.3+p.pulse)*0.5,dr=pr+t01*5,da=0.38+t01*0.62;cx.beginPath();cx.arc(p.x,p.y,dr,0,Math.PI*2);cx.fillStyle='rgba('+C+','+da+')';cx.fill();if(t01>0.01){cx.beginPath();cx.arc(p.x,p.y,dr+4+(1-t01)*10,0,Math.PI*2);cx.strokeStyle='rgba('+C+','+(t01*0.5)+')';cx.lineWidth=1.5;cx.stroke();cx.save();cx.font='600 10.5px "SF Mono","Fira Code",monospace';cx.fillStyle='rgba(80,50,210,'+(t01*0.95)+')';cx.textBaseline='middle';var ol=p.x>W/2;if(ol){cx.textAlign='right';cx.fillText(p.label,p.x-dr-7,p.y);}else{cx.textAlign='left';cx.fillText(p.label,p.x+dr+7,p.y);}cx.restore();}p.x+=p.vx;p.y+=p.vy;cl(p);}requestAnimationFrame(fr);}window.addEventListener('resize',rsz);rsz();sk();fr();})();</script> -->
<script>
/* Interpretability lineage cascades - v3 background */
(function(){
  var cv=document.getElementById('bg-canvas'),cx=cv.getContext('2d');
  var W,H,cL,cR,nodes=[],idx={},edges=[],pulses=[],roots=[];
  var CW=720,MP=20,FADE=2200,HOP=430,HOVER=130,MINM=110,GAP=21;
  var ECOL=['186,178,224','170,150,226','152,124,228','134,98,230','116,74,232','100,54,228','88,40,220'];
  var mx=-1e4,my=-1e4;

  // [label, era 0-6 (old to new), side 0=left margin 1=right, position across margin, y offset]
  var ND=[
    ['Saliency Map',0,0,0.58,-10],['LRP',0,0,0.22,10],
    ['LIME',1,0,0.60,-10],['GradCAM',1,0,0.24,8],
    ['SHAP',2,0,0.58,-12],['DeepLIFT',2,0,0.22,0],['SmoothGrad',2,0,0.40,12],
    ['Integrated Grads',3,0,0.58,-12],['Anchors',3,0,0.22,6],
    ['Data Shapley',4,0,0.62,-10],['Influence Function',4,0,0.24,-2],['TracIn',4,0,0.44,12],
    ['Feature Attribution',5,0,0.22,-8],['Faithfulness',5,0,0.56,6],
    ['Model Debugging',6,0,0.24,-4],['Human Alignment',6,0,0.56,8],
    ['Feature Visualization',0,1,0.45,-8],
    ['Linear Probe',1,1,0.26,-10],['Prototypes',1,1,0.58,8],
    ['Probing Classifier',2,1,0.22,4],['TCAV',2,1,0.54,-12],
    ['Concept Bottleneck',3,1,0.24,-10],['Logit Lens',3,1,0.44,10],['ProtoPNet',3,1,0.62,-2],
    ['Activation Patch',4,1,0.22,6],['Circuit',4,1,0.56,-10],
    ['Superposition',5,1,0.22,2],['Causal Tracing',5,1,0.38,12],['Sparse Autoencoder',5,1,0.54,-12],
    ['Steering Vector',6,1,0.24,-4],['Steerling-8B \u2605',6,1,0.56,8]
  ];

  var LIN={
    'Saliency Map':['GradCAM','SmoothGrad'],
    'LRP':['DeepLIFT'],
    'LIME':['SHAP','Anchors'],
    'GradCAM':['SmoothGrad'],
    'SHAP':['Data Shapley','Integrated Grads'],
    'DeepLIFT':['Integrated Grads'],
    'SmoothGrad':['Integrated Grads'],
    'Integrated Grads':['Feature Attribution'],
    'Anchors':['Feature Attribution'],
    'Influence Function':['TracIn','Data Shapley'],
    'Data Shapley':['Feature Attribution'],
    'TracIn':['Feature Attribution'],
    'Feature Attribution':['Faithfulness','Model Debugging'],
    'Faithfulness':['Human Alignment','Model Debugging'],
    'Feature Visualization':['Prototypes','Linear Probe'],
    'Linear Probe':['Probing Classifier','TCAV'],
    'Prototypes':['ProtoPNet'],
    'Probing Classifier':['Logit Lens'],
    'TCAV':['Concept Bottleneck'],
    'Concept Bottleneck':['Steerling-8B \u2605'],
    'ProtoPNet':['Steerling-8B \u2605'],
    'Logit Lens':['Circuit'],
    'Circuit':['Superposition','Sparse Autoencoder'],
    'Activation Patch':['Causal Tracing'],
    'Superposition':['Sparse Autoencoder'],
    'Causal Tracing':['Steering Vector'],
    'Sparse Autoencoder':['Steering Vector','Steerling-8B \u2605']
  };

  function margins(){cL=Math.max(0,(W-CW)/2)-MP;cR=Math.min(W,(W+CW)/2)+MP;}

  function place(){
    for(var i=0;i<nodes.length;i++){
      var n=nodes[i];
      n.x=n.side===0?n.xr*cL:cR+(1-n.xr)*(W-cR);
      n.y=(0.07+n.era/6*0.86)*H+n.jy;
    }
    // push apart any labels that would overlap vertically
    for(var s=0;s<2;s++){
      var col=[];
      for(i=0;i<nodes.length;i++) if(nodes[i].side===s) col.push(nodes[i]);
      col.sort(function(a,b){return a.y-b.y;});
      for(i=1;i<col.length;i++) if(col[i].y-col[i-1].y<GAP) col[i].y=col[i-1].y+GAP;
      var over=col.length?col[col.length-1].y-(H-16):0;
      if(over>0) for(i=0;i<col.length;i++) col[i].y-=over;
    }
  }

  function build(){
    nodes=[];idx={};edges=[];pulses=[];roots=[];
    for(var i=0;i<ND.length;i++){
      var d=ND[i];
      nodes.push({label:d[0],era:d[1],side:d[2],xr:d[3],jy:d[4],x:0,y:0,actAt:0,actS:0,ph:Math.random()*6.2832});
      idx[d[0]]=i;
    }
    for(var k in LIN){
      var a=idx[k];
      if(a==null) continue;
      roots.push(a);
      for(var j=0;j<LIN[k].length;j++){
        var b=idx[LIN[k][j]];
        if(b!=null&&nodes[b].side===nodes[a].side) edges.push([a,b]);
      }
    }
    place();
  }

  function resize(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;margins();place();}

  function fire(i,s,depth){
    var n=nodes[i];
    n.actAt=Date.now();n.actS=s;
    if(depth>=2) return;
    var kids=LIN[n.label];
    if(!kids||!kids.length) return;
    var pick=kids.slice().sort(function(){return Math.random()-0.5;}).slice(0,depth===0?2:1);
    for(var j=0;j<pick.length;j++){
      var b=idx[pick[j]];
      if(b==null) continue;
      if(nodes[b].side===n.side) pulses.push({a:i,b:b,t0:Date.now()});
      (function(t){setTimeout(function(){fire(t,s*0.7,depth+1);},HOP);})(b);
    }
  }

  function cascade(){
    if(roots.length) fire(roots[Math.floor(Math.random()*roots.length)],1,0);
    setTimeout(cascade,1500+Math.random()*900);
  }

  function label(n,r,alpha,bright,star){
    cx.save();
    cx.font=(bright?'600 ':'400 ')+(star?12:(bright?10.5:9.5))+'px "SF Mono","Fira Code",monospace';
    var w=cx.measureText(n.label).width,pad=r+6,lx,align;
    if(n.side===0){
      if(n.x-pad-w>6){lx=n.x-pad;align='right';}
      else if(n.x+pad+w<cL-6){lx=n.x+pad;align='left';}
      else if(w+16<cL){lx=8;align='left';}
      else{cx.restore();return;}
    }else{
      if(n.x+pad+w<W-6){lx=n.x+pad;align='left';}
      else if(n.x-pad-w>cR+6){lx=n.x-pad;align='right';}
      else if(w+16<W-cR){lx=W-8;align='right';}
      else{cx.restore();return;}
    }
    cx.textAlign=align;cx.textBaseline='middle';
    cx.fillStyle='rgba(80,50,210,'+alpha+')';
    cx.fillText(n.label,lx,n.y);
    cx.restore();
  }

  function frame(){
    cx.clearRect(0,0,W,H);
    if(cL<MINM){requestAnimationFrame(frame);return;}
    var now=Date.now(),t=now*0.001,i;

    for(i=0;i<edges.length;i++){
      var ea=nodes[edges[i][0]],eb=nodes[edges[i][1]];
      cx.beginPath();cx.strokeStyle='rgba('+ECOL[ea.era]+',0.13)';cx.lineWidth=0.8;
      cx.moveTo(ea.x,ea.y);cx.lineTo(eb.x,eb.y);cx.stroke();
    }

    for(i=pulses.length-1;i>=0;i--){
      var p=pulses[i],k=(now-p.t0)/HOP;
      if(k>=1){pulses.splice(i,1);continue;}
      var pa=nodes[p.a],pb=nodes[p.b],e=k*k*(3-2*k);
      var px=pa.x+(pb.x-pa.x)*e,py=pa.y+(pb.y-pa.y)*e;
      cx.beginPath();cx.strokeStyle='rgba('+ECOL[pa.era]+','+(0.45*(1-k))+')';cx.lineWidth=1.3;
      cx.moveTo(pa.x,pa.y);cx.lineTo(px,py);cx.stroke();
      cx.beginPath();cx.arc(px,py,2.4,0,6.2832);
      cx.fillStyle='rgba('+ECOL[pa.era]+',0.9)';cx.fill();
    }

    for(i=0;i<nodes.length;i++){
      var n=nodes[i],C=ECOL[n.era],star=n.label.indexOf('\u2605')>-1;
      var sp=n.actAt?Math.max(0,1-(now-n.actAt)/FADE)*n.actS:0;
      var dx=n.x-mx,dy=n.y-my,dd=Math.sqrt(dx*dx+dy*dy);
      var hv=dd<HOVER?(1-dd/HOVER)*0.9:0;
      var a=Math.max(sp,hv);
      var r=(star?4:2.1)+Math.sin(t*1.2+n.ph)*0.35+a*(star?5:3.4);
      if(a>0.04){
        cx.beginPath();cx.arc(n.x,n.y,r+4+(1-a)*12,0,6.2832);
        cx.strokeStyle='rgba('+C+','+a*0.45+')';cx.lineWidth=star?2.2:1.3;cx.stroke();
      }
      cx.beginPath();cx.arc(n.x,n.y,r,0,6.2832);
      cx.fillStyle='rgba('+C+','+((star?0.5:0.22)+a*0.78)+')';cx.fill();
      label(n,r,(star?0.42:0.2)+a*0.75,a>0.35,star);
    }
    requestAnimationFrame(frame);
  }

  window.addEventListener('mousemove',function(e){mx=e.clientX;my=e.clientY;});
  window.addEventListener('mouseout',function(){mx=-1e4;my=-1e4;});
  window.addEventListener('resize',resize);
  W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;
  margins();build();cascade();frame();
})();
</script>
</body>
</html>
