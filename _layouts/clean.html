<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | default: '' | strip_html | normalize_whitespace | truncate: 160 | escape }}">
  <link rel="icon" type="image/png" href="{{ '/assets/images/favicon.png' | relative_url }}">
  {% if page.redirect_to %}<meta http-equiv="refresh" content="0; url={{ page.redirect_to }}">{% endif %}
  <style>
    /* subtle purple gradient wash behind everything */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(ellipse 60% 50% at 5% 10%,  rgba(100, 70, 220, 0.18) 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 95% 85%, rgba(120, 60, 210, 0.14) 0%, transparent 70%);
      pointer-events: none;
    }
  </style>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.65;
      color: #111;
      background: #fff;
      margin: 0;
      padding: 0;
    }

    .page-wrap {
      max-width: 680px;
      margin: 0 auto;
      padding: 3rem 1.25rem 5rem;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin: 0 0 0.2rem;
      color: #000;
      letter-spacing: -0.02em;
    }

    h2 {
      font-size: 0.95rem;
      font-weight: 700;
      margin: 0 0 0.75rem;
      color: #000;
      text-transform: lowercase;
      letter-spacing: 0.01em;
    }

    p { margin: 0.6rem 0; color: #444; }

    a { color: #0066cc; text-decoration: none; }
    a:hover { text-decoration: underline; }

    hr {
      border: none;
      border-top: 1px solid #eaeaea;
      margin: 2.25rem 0;
    }

    ul {
      margin: 0.4rem 0;
      padding-left: 1.2rem;
      color: #444;
    }

    li { margin: 0.35rem 0; }

    strong { color: #111; }

    /* Links row */
    .links {
      font-size: 0.88rem;
      margin-bottom: 2rem;
      color: #888;
    }

    .links a { color: #0066cc; }
    .links .sep { margin: 0 0.4rem; color: #ddd; }

    /* Profile block with photo */
    .profile {
      display: flex;
      gap: 1.5rem;
      align-items: flex-start;
      margin-bottom: 0.5rem;
    }

    .profile img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 6px;
      flex-shrink: 0;
    }

    .profile p:first-child { margin-top: 0; }

    /* Timeline entries */
    .entry {
      display: flex;
      gap: 1.25rem;
      margin-bottom: 1.25rem;
      align-items: flex-start;
    }

    .entry-period {
      font-size: 0.78rem;
      font-weight: 600;
      color: #bbb;
      width: 90px;
      flex-shrink: 0;
      padding-top: 0.15rem;
    }

    .entry-body { flex: 1; }

    .entry-title { font-weight: 600; color: #111; }
    .entry-sub { color: #666; font-size: 0.92rem; }

    .entry-logo {
      display: inline-block;
      height: 18px;
      width: auto;
      vertical-align: middle;
      margin-right: 0.4rem;
      object-fit: contain;
      filter: grayscale(30%);
      opacity: 0.85;
    }

    .entry-detail {
      margin-top: 0.35rem;
      font-size: 0.9rem;
      color: #555;
    }

    .entry-detail ul { margin: 0.3rem 0; padding-left: 1.1rem; }
    .entry-detail li { margin: 0.25rem 0; }

    /* Publications */
    .pub {
      margin-bottom: 0.8rem;
      font-size: 0.91rem;
      color: #444;
      line-height: 1.5;
    }

    .pub-venue {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 700;
      color: #666;
      background: #f2f2f2;
      padding: 0.1rem 0.4rem;
      border-radius: 3px;
      margin-right: 0.3rem;
      vertical-align: middle;
    }

    /* Back link for sub-pages */
    .back {
      font-size: 0.88rem;
      color: #888;
      margin-bottom: 2rem;
      display: block;
    }

    /* Footer */
    .page-footer {
      color: #ccc;
      font-size: 0.8rem;
      margin-top: 2.5rem;
      border-top: 1px solid #f5f5f5;
      padding-top: 1.25rem;
    }

    @media (max-width: 500px) {
      .profile { flex-direction: column; }
      .profile img { width: 75px; height: 75px; }
      h1 { font-size: 1.4rem; }
      .entry { flex-direction: column; gap: 0.15rem; }
      .entry-period { width: auto; }
    }
  </style>
</head>
<body>
<div class="page-wrap">
  {{ content }}
</div>
<canvas id="bg-canvas" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;pointer-events:none;"></canvas>
<script src="{{ '/assets/js/bg.js' | relative_url }}"></script>
</body>
</html>
