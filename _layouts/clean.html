<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | default: '' | strip_html | normalize_whitespace | truncate: 160 | escape }}">
  <link rel="icon" type="image/png" sizes="512x512" href="{{ '/assets/images/favicon.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/images/favicon.png' | relative_url }}">
  {% if page.redirect_to %}<meta http-equiv="refresh" content="0; url={{ page.redirect_to }}">{% endif %}
  <style>
    /* gradient wash behind everything; the rotating background recolors these */
    :root {
      --wash-a: rgba(100, 70, 220, 0.18);
      --wash-b: rgba(120, 60, 210, 0.14);
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(ellipse 60% 50% at 5% 10%,  var(--wash-a) 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 95% 85%, var(--wash-b) 0%, transparent 70%);
      pointer-events: none;
    }
  </style>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.65;
      color: #111;
      background: #fff;
      margin: 0;
      padding: 0;
    }

    .page-wrap {
      max-width: 680px;
      margin: 0 auto;
      padding: 3rem 1.25rem 5rem;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin: 0 0 0.2rem;
      color: #000;
      letter-spacing: -0.02em;
    }

    h2 {
      font-size: 0.95rem;
      font-weight: 700;
      margin: 0 0 0.75rem;
      color: #5a3adc;
      text-transform: lowercase;
      letter-spacing: 0.01em;
    }

    p { margin: 0.6rem 0; color: #444; }

    a { color: #0066cc; text-decoration: none; }
    a:hover { text-decoration: underline; }

    hr {
      border: none;
      border-top: 1px solid #eaeaea;
      margin: 2.25rem 0;
    }

    ul {
      margin: 0.4rem 0;
      padding-left: 1.2rem;
      color: #444;
    }

    li { margin: 0.35rem 0; }

    strong { color: #111; }

    /* Links row */
    .links {
      font-size: 0.88rem;
      margin-bottom: 2rem;
      color: #888;
    }

    .links a { color: #0066cc; }
    .links .sep { margin: 0 0.4rem; color: #ddd; }

    /* Profile block with photo */
    .profile {
      display: flex;
      gap: 1.5rem;
      align-items: flex-start;
      margin-bottom: 0.5rem;
    }

    .profile img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 6px;
      flex-shrink: 0;
    }

    .profile p:first-child { margin-top: 0; }

    /* Timeline entries */
    .entry {
      display: flex;
      gap: 1.25rem;
      margin-bottom: 1.25rem;
      align-items: flex-start;
    }

    .entry-period {
      font-size: 0.78rem;
      font-weight: 600;
      color: #bbb;
      width: 90px;
      flex-shrink: 0;
      padding-top: 0.15rem;
    }

    .entry-body { flex: 1; }

    .entry-title { font-weight: 600; color: #111; }
    .entry-sub { color: #666; font-size: 0.92rem; }

    .entry-logo {
      display: inline-block;
      height: 18px;
      width: auto;
      vertical-align: middle;
      margin-right: 0.4rem;
      object-fit: contain;
      filter: grayscale(30%);
      opacity: 0.85;
    }

    .entry-detail {
      margin-top: 0.35rem;
      font-size: 0.9rem;
      color: #555;
    }

    .entry-detail ul { margin: 0.3rem 0; padding-left: 1.1rem; }
    .entry-detail li { margin: 0.25rem 0; }

    /* Publications */
    .pub {
      margin-bottom: 0.8rem;
      font-size: 0.91rem;
      color: #444;
      line-height: 1.5;
    }

    .pub-venue {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 700;
      color: #666;
      background: #f2f2f2;
      padding: 0.1rem 0.4rem;
      border-radius: 3px;
      margin-right: 0.3rem;
      vertical-align: middle;
    }

    /* Back link for sub-pages */
    .back {
      font-size: 0.88rem;
      color: #888;
      margin-bottom: 2rem;
      display: block;
    }

    /* Footer */
    .page-footer {
      color: #ccc;
      font-size: 0.8rem;
      margin-top: 2.5rem;
      border-top: 1px solid #f5f5f5;
      padding-top: 1.25rem;
    }

    @media (max-width: 500px) {
      .profile { flex-direction: column; }
      .profile img { width: 75px; height: 75px; }
      h1 { font-size: 1.4rem; }
      .entry { flex-direction: column; gap: 0.15rem; }
      .entry-period { width: auto; }
    }
  </style>
</head>
<body>
<div class="page-wrap">
  {{ content }}
</div>
<canvas id="bg-canvas" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;pointer-events:none;"></canvas>
<script>
/* Rotating interpretability backgrounds - v4 */
(function(){
  var cv=document.getElementById('bg-canvas');
  if(!cv) return;
  var cx=cv.getContext('2d');
  var W,H,cL,cR,V,frameNo=0;
  var CW=720,MP=20,MINM=110,GAP=21;

  var TH=[
    {id:'lineage',      pale:'186,178,224', dot:'96,56,222',  lab:'80,50,210',  a:'rgba(100,70,220,0.18)', b:'rgba(120,60,210,0.14)'},
    {id:'influence',    pale:'176,212,186', dot:'44,146,86',  lab:'30,118,68',  a:'rgba(60,162,96,0.16)',  b:'rgba(40,142,82,0.12)'},
    {id:'actmap',       pale:'226,186,196', dot:'204,60,96',  lab:'170,52,96',  a:'rgba(214,64,72,0.15)',  b:'rgba(48,96,210,0.13)',
     pos:'208,54,62', neg:'40,88,200'},
    {id:'rain',         pale:'236,214,164', dot:'196,138,28', lab:'166,112,18', a:'rgba(226,166,60,0.15)', b:'rgba(214,140,40,0.11)'},
    {id:'molecules',    pale:'158,206,206', dot:'16,146,152', lab:'12,116,122', a:'rgba(20,150,152,0.16)', b:'rgba(10,132,142,0.13)'},
    {id:'sparsecode',   pale:'170,190,240', dot:'40,84,210',  lab:'28,66,178',  a:'rgba(48,92,222,0.16)',  b:'rgba(36,76,200,0.12)'},
    {id:'attention',    pale:'232,180,216', dot:'188,42,140', lab:'156,32,116', a:'rgba(212,56,158,0.15)', b:'rgba(190,44,140,0.11)'},
    {id:'layersweep',   pale:'198,214,150', dot:'116,150,28', lab:'92,122,18',  a:'rgba(140,176,40,0.16)', b:'rgba(118,154,30,0.12)'},
    {id:'ablation',     pale:'242,192,172', dot:'222,94,50',  lab:'188,76,38',  a:'rgba(236,112,64,0.15)', b:'rgba(216,92,50,0.11)'},
    {id:'logitlens',    pale:'188,198,212', dot:'78,98,128',  lab:'56,74,102',  a:'rgba(92,116,150,0.15)', b:'rgba(74,94,124,0.11)'}
  ];

  var qs=/[?&]bg=(\d+)/.exec(location.search);
  // A fresh theme on every visit. Themes are drawn from a shuffled bag held in
  // session storage, so all of them show up before any one repeats.
  function pickTheme(){
    var bag=[],last=null,i,j,tmp;
    try{
      bag=JSON.parse(sessionStorage.getItem('bgbag')||'[]');
      last=sessionStorage.getItem('bglast');
    }catch(e){}
    if(!bag||!bag.length){
      bag=[];
      for(i=0;i<TH.length;i++) bag.push(i);
      for(i=bag.length-1;i>0;i--){
        j=Math.floor(Math.random()*(i+1));tmp=bag[i];bag[i]=bag[j];bag[j]=tmp;
      }
      if(last!==null&&bag.length>1&&bag[0]===+last){tmp=bag[0];bag[0]=bag[1];bag[1]=tmp;}
    }
    var pick=bag.shift();
    if(pick==null||pick<0||pick>=TH.length) pick=Math.floor(Math.random()*TH.length);
    try{
      sessionStorage.setItem('bgbag',JSON.stringify(bag));
      sessionStorage.setItem('bglast',pick);
    }catch(e){}
    return pick;
  }
  var VI=qs?(parseInt(qs[1],10)||0)%TH.length:pickTheme();
  var T=TH[VI];

  var root=document.documentElement;
  if(root&&root.style&&root.style.setProperty){
    root.style.setProperty('--wash-a',T.a);
    root.style.setProperty('--wash-b',T.b);
  }

  function mix(c1,c2,k){
    var a=c1.split(','),b=c2.split(',');
    return Math.round(+a[0]+(+b[0]-+a[0])*k)+','+Math.round(+a[1]+(+b[1]-+a[1])*k)+','+Math.round(+a[2]+(+b[2]-+a[2])*k);
  }
  var RAMP=[];
  for(var ri=0;ri<7;ri++) RAMP.push(mix(T.pale,T.dot,ri/6));
  var MID=mix(T.pale,T.dot,0.42);
  var MIXRB=T.pos?mix(T.pos,T.neg,0.5):MID;

  function diamond(x,y,r){
    cx.beginPath();
    cx.moveTo(x,y-r);cx.lineTo(x+r,y);cx.lineTo(x,y+r);cx.lineTo(x-r,y);
    cx.closePath();
  }

  // Flat vocabulary, used by the free-form variants
  var KW=['LIME','SHAP','Shapley values','counterfactual','anchors','integrated gradients','saliency map',
    'DeepLIFT','LRP','occlusion sensitivity','GradCAM','class activation map','SmoothGrad',
    'partial dependence plot','feature interaction','surrogate model','RuleFit','decision rules',
    'influence function','nearest neighbors','prototype','criticisms','data shapley','TracIn',
    'adversarial examples','ProtoPNet','TCAV','concept bottleneck','concept vector','concept activation',
    'concept probing','sparse autoencoder','steering vector','linear probe','activation patching',
    'causal tracing','logit lens','superposition','monosemanticity','polysemanticity','circuit',
    'attention head','residual stream','feature attribution','representation engineering',
    'probing classifier','knowledge neuron','model editing','activation maximization',
    'feature visualization','faithfulness','plausibility','simulatability','human alignment',
    'model debugging','AI-assisted decision-making','gradient \u00d7 input','contrastive explanation',
    'influential instances','algorithmic recourse','concept discovery','concept intervention',
    'concept erasure','rule list','decision tree','intrinsic interpretability','ante-hoc explanation',
    'induction head','name mover head','QK circuit','OV circuit','tuned lens','path patching',
    'attribution patching','direct logit attribution','ablation','circuit tracing','attribution graph',
    'replacement model','privileged basis','linear representation','feature geometry','grokking',
    'causal abstraction','parameter decomposition','self-repair','copy suppression','ACDC',
    'dictionary learning','transcoder','crosscoder','cross-layer transcoder','feature splitting',
    'feature absorption','dead latents','TopK SAE','JumpReLU SAE','SAE latent','auto-interp',
    'feature dashboard','sparse probing','attention probe','interchange intervention','patchscopes',
    'latent knowledge','model diffing','CKA','DAS','activation steering','activation addition',
    'feature steering','refusal direction','directional ablation','knowledge editing','task vector',
    'function vector','machine unlearning','circuit breakers','inference-time intervention','sanity checks',
    'interpretability illusion','deletion metric','Rashomon effect','thought anchor','monitorability',
    'CoT monitorability','CoT faithfulness','externalized reasoning','white-box evaluation',
    'anomaly detection','deception detection','sleeper agents','alignment faking','sandbagging',
    'scalable oversight','safety case','microscope AI','model organism','datamodels','TRAK','leave-one-out',
    'memorization','data attribution'];

  // [label, era 0-6 (old to new), side 0=left 1=right, position across margin, y offset]
  var ND=[
    ['Saliency Map',0,0,0.58,-10],['LRP',0,0,0.22,10],
    ['LIME',1,0,0.60,-10],['GradCAM',1,0,0.24,8],
    ['SHAP',2,0,0.58,-12],['DeepLIFT',2,0,0.22,0],['SmoothGrad',2,0,0.40,12],
    ['Integrated Grads',3,0,0.58,-12],['Anchors',3,0,0.22,6],
    ['Data Shapley',4,0,0.62,-10],['Influence Function',4,0,0.24,-2],['TracIn',4,0,0.44,12],
    ['Feature Attribution',5,0,0.22,-8],['Faithfulness',5,0,0.56,6],
    ['Model Debugging',6,0,0.24,-4],['Human Alignment',6,0,0.56,8],
    ['Feature Visualization',0,1,0.45,-8],
    ['Linear Probe',1,1,0.26,-10],['Prototypes',1,1,0.58,8],
    ['Probing Classifier',2,1,0.22,4],['TCAV',2,1,0.54,-12],
    ['Concept Bottleneck',3,1,0.24,-10],['Logit Lens',3,1,0.44,10],['ProtoPNet',3,1,0.62,-2],
    ['Activation Patching',4,1,0.22,6],['Circuit',4,1,0.56,-10],
    ['Superposition',5,1,0.22,2],['Causal Tracing',5,1,0.38,12],['Sparse Autoencoder',5,1,0.54,-12],
    ['Steering Vector',6,1,0.24,-4],['Interpretable by Design',6,1,0.56,8]
  ];

  var LIN={
    'Saliency Map':['GradCAM','SmoothGrad'],'LRP':['DeepLIFT'],
    'LIME':['SHAP','Anchors'],'GradCAM':['SmoothGrad'],
    'SHAP':['Data Shapley','Integrated Grads'],'DeepLIFT':['Integrated Grads'],
    'SmoothGrad':['Integrated Grads'],'Integrated Grads':['Feature Attribution'],
    'Anchors':['Feature Attribution'],'Influence Function':['TracIn','Data Shapley'],
    'Data Shapley':['Feature Attribution'],'TracIn':['Feature Attribution'],
    'Feature Attribution':['Faithfulness','Model Debugging'],
    'Faithfulness':['Human Alignment','Model Debugging'],
    'Feature Visualization':['Prototypes','Linear Probe'],
    'Linear Probe':['Probing Classifier','TCAV'],'Prototypes':['ProtoPNet'],
    'Probing Classifier':['Logit Lens'],'TCAV':['Concept Bottleneck'],
    'Concept Bottleneck':['Interpretable by Design'],'ProtoPNet':['Interpretable by Design'],
    'Logit Lens':['Circuit'],'Circuit':['Superposition','Sparse Autoencoder'],
    'Activation Patching':['Causal Tracing'],'Superposition':['Sparse Autoencoder'],
    'Causal Tracing':['Steering Vector'],
    'Sparse Autoencoder':['Steering Vector','Interpretable by Design']
  };

  function margins(){cL=Math.max(0,(W-CW)/2)-MP;cR=Math.min(W,(W+CW)/2)+MP;}

  function marginX(){
    var lw=cL,rw=W-cR;
    if(lw+rw<=0) return Math.random()*W;
    return Math.random()<lw/(lw+rw)?Math.random()*lw:cR+Math.random()*rw;
  }

  function label(txt,x,y,side,alpha,size,bold,pad,col){
    cx.save();
    cx.font=(bold?'600 ':'400 ')+size+'px "SF Mono","Fira Code",monospace';
    var w=cx.measureText(txt).width,lx,al;
    if(side===0){
      if(x-pad-w>6){lx=x-pad;al='right';}
      else if(x+pad+w<cL-6){lx=x+pad;al='left';}
      else if(w+16<cL){lx=8;al='left';}
      else{cx.restore();return;}
    }else{
      if(x+pad+w<W-6){lx=x+pad;al='left';}
      else if(x-pad-w>cR+6){lx=x-pad;al='right';}
      else if(w+16<W-cR){lx=W-8;al='right';}
      else{cx.restore();return;}
    }
    cx.textAlign=al;cx.textBaseline='middle';
    if(alpha>0.15){
      cx.lineJoin='round';cx.lineWidth=3;
      cx.strokeStyle='rgba(255,255,255,'+Math.min(0.9,alpha+0.3)+')';
      cx.strokeText(txt,lx,y);
    }
    cx.fillStyle='rgba('+(col||T.lab)+','+alpha+')';
    cx.fillText(txt,lx,y);
    cx.restore();
  }

  // Shared era-graph geometry, used by the lineage and sweep variants
  var nodes=[],idx={},edges=[];
  function buildGraph(){
    nodes=[];idx={};edges=[];
    for(var i=0;i<ND.length;i++){
      var d=ND[i];
      nodes.push({label:d[0],era:d[1],side:d[2],xr:d[3],jy:d[4],x:0,y:0,actAt:0,actS:0,ph:Math.random()*6.2832});
      idx[d[0]]=i;
    }
    for(var k in LIN){
      var a=idx[k];
      if(a==null) continue;
      for(var j=0;j<LIN[k].length;j++){
        var b=idx[LIN[k][j]];
        if(b!=null&&nodes[b].side===nodes[a].side) edges.push([a,b]);
      }
    }
    placeGraph();
  }
  function placeGraph(){
    var i,s;
    for(i=0;i<nodes.length;i++){
      var n=nodes[i];
      n.x=n.side===0?n.xr*cL:cR+(1-n.xr)*(W-cR);
      n.y=(0.07+n.era/6*0.86)*H+n.jy;
    }
    for(s=0;s<2;s++){
      var col=[];
      for(i=0;i<nodes.length;i++) if(nodes[i].side===s) col.push(nodes[i]);
      col.sort(function(a,b){return a.y-b.y;});
      for(i=1;i<col.length;i++) if(col[i].y-col[i-1].y<GAP) col[i].y=col[i-1].y+GAP;
      var over=col.length?col[col.length-1].y-(H-16):0;
      if(over>0) for(i=0;i<col.length;i++) col[i].y-=over;
    }
  }

  // Variant 0: lineage cascades
  var lineage={
    pulses:[],roots:[],timer:0,
    init:function(){
      buildGraph();this.pulses=[];this.roots=[];
      for(var k in LIN) if(idx[k]!=null) this.roots.push(idx[k]);
      if(!this.timer) this.tick();
    },
    tick:function(){
      var self=this;
      if(this.roots.length) this.fire(this.roots[Math.floor(Math.random()*this.roots.length)],1,0);
      this.timer=setTimeout(function(){self.tick();},1500+Math.random()*900);
    },
    fire:function(i,s,depth){
      var n=nodes[i],self=this;
      if(!n) return;
      n.actAt=Date.now();n.actS=s;
      if(depth>=2) return;
      var kids=LIN[n.label];
      if(!kids||!kids.length) return;
      var pick=kids.slice().sort(function(){return Math.random()-0.5;}).slice(0,depth===0?2:1);
      for(var j=0;j<pick.length;j++){
        var b=idx[pick[j]];
        if(b==null) continue;
        if(nodes[b].side===n.side) this.pulses.push({a:i,b:b,t0:Date.now()});
        (function(t){setTimeout(function(){self.fire(t,s*0.7,depth+1);},430);})(b);
      }
    },
    draw:function(now,t){
      var i;
      for(i=0;i<edges.length;i++){
        var ea=nodes[edges[i][0]],eb=nodes[edges[i][1]];
        cx.beginPath();cx.strokeStyle='rgba('+RAMP[ea.era]+',0.13)';cx.lineWidth=0.8;
        cx.moveTo(ea.x,ea.y);cx.lineTo(eb.x,eb.y);cx.stroke();
      }
      for(i=this.pulses.length-1;i>=0;i--){
        var p=this.pulses[i],k=(now-p.t0)/430;
        if(k>=1){this.pulses.splice(i,1);continue;}
        var pa=nodes[p.a],pb=nodes[p.b],e=k*k*(3-2*k);
        var px=pa.x+(pb.x-pa.x)*e,py=pa.y+(pb.y-pa.y)*e;
        cx.beginPath();cx.strokeStyle='rgba('+RAMP[pa.era]+','+(0.45*(1-k))+')';cx.lineWidth=1.3;
        cx.moveTo(pa.x,pa.y);cx.lineTo(px,py);cx.stroke();
        cx.beginPath();cx.arc(px,py,2.4,0,6.2832);
        cx.fillStyle='rgba('+RAMP[pa.era]+',0.9)';cx.fill();
      }
      for(i=0;i<nodes.length;i++){
        var n=nodes[i],C=RAMP[n.era];
        var sp=n.actAt?Math.max(0,1-(now-n.actAt)/2200)*n.actS:0;
        var a=Math.max(sp,hover(n.x,n.y));
        var r=2.1+Math.sin(t*1.2+n.ph)*0.35+a*3.4;
        if(a>0.04){
          cx.beginPath();cx.arc(n.x,n.y,r+4+(1-a)*12,0,6.2832);
          cx.strokeStyle='rgba('+C+','+a*0.45+')';cx.lineWidth=1.3;cx.stroke();
        }
        cx.beginPath();cx.arc(n.x,n.y,r,0,6.2832);
        cx.fillStyle='rgba('+C+','+(0.22+a*0.78)+')';cx.fill();
        label(n.label,n.x,n.y,n.side,0.2+a*0.75,a>0.35?10.5:9.5,a>0.35,r+6);
      }
    }
  };

  // Variant 1: influence-weighted concept graph
  // Circle area encodes how influential a term has been; edges link terms in the same family.
  var influence={
    R:[0,14,10,6.5,4.5],
    APP:90,APPD:600,EDG:60,EDGD:420,
    DATA:[
      ['saliency map',1,0,'grad'],['GradCAM',1,0,'grad'],['integrated gradients',1,0,'grad'],
      ['LRP',2,0,'grad'],
      ['LIME',1,0,'pert'],['SHAP',1,0,'pert'],['anchors',2,0,'pert'],
      ['TCAV',2,0,'concept'],['concept bottleneck',2,0,'concept'],['ProtoPNet',2,0,'concept'],
      ['counterfactual',2,0,'example'],['influential instances',4,0,'example'],
      ['influence function',2,0,'tda'],['data Shapley',3,0,'tda'],['TracIn',3,0,'tda'],
      ['faithfulness',3,0,'eval'],['sanity checks',4,0,'eval'],
      ['circuit',1,1,'circuits'],['attention head',2,1,'circuits'],['induction head',2,1,'circuits'],
      ['logit lens',3,1,'circuits'],
      ['superposition',1,1,'features'],['monosemanticity',2,1,'features'],
      ['sparse autoencoder',1,1,'sae'],['dictionary learning',3,1,'sae'],['transcoder',4,1,'sae'],
      ['activation patching',2,1,'causal'],['causal tracing',3,1,'causal'],
      ['attribution graph',4,1,'causal'],
      ['linear probe',2,1,'probe'],['feature visualization',2,1,'probe'],['monitorability',4,1,'probe'],
      ['steering vector',2,1,'steer'],['model editing',3,1,'steer'],['refusal direction',4,1,'steer']
    ],
    BR:[
      ['SHAP','integrated gradients'],['LIME','counterfactual'],['SHAP','data Shapley'],
      ['saliency map','faithfulness'],['GradCAM','TCAV'],
      ['ProtoPNet','influential instances'],
      ['circuit','activation patching'],['attribution graph','circuit'],
      ['attention head','linear probe'],['feature visualization','monosemanticity'],
      ['superposition','sparse autoencoder'],['monosemanticity','dictionary learning'],
      ['sparse autoencoder','steering vector']
    ],

        else{fr=(g.W-g.cR)>0?(n.x-g.cR)/(g.W-g.cR):0.5;n.x=cR+fr*Math.max(1,W-cR);}

  // Variant 2: red/blue activation map that grows a concept network, then clears

  var actmap={

    },
    place:function(){
      var side=this.terms.length%2;

      if(side===1&&this.mw(1)<90) side=0;
      var best=null,bestD=-1;
      for(var k=0;k<16;k++){
        var fx=0.14+Math.random()*0.72,fy=0.07+Math.random()*0.86,md=1e9;

          var q=this.terms[i];

  var mx=-1e4,my=-1e4;
  function hover(x,y){
    var dx=x-mx,dy=y-my,d=Math.sqrt(dx*dx+dy*dy);
    return d<130?(1-d/130)*0.9:0;
  }

  function resize(){
    W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;
    margins();
    if(cL>=MINM) V.init();
  }

  function frame(){
    frameNo++;
    cx.clearRect(0,0,W,H);
    if(cL>=MINM) V.draw(Date.now(),Date.now()*0.001);
    requestAnimationFrame(frame);
  }

  window.addEventListener('mousemove',function(e){mx=e.clientX;my=e.clientY;});
  window.addEventListener('mouseout',function(){mx=-1e4;my=-1e4;});
  window.addEventListener('resize',resize);
  resize();frame();
})();
</script>
</body>
</html>
