<!doctype html><html><head><meta charset="utf-8"><style>:root{--wash-a:rgba(100,70,220,0.18);--wash-b:rgba(120,60,210,0.14);}body{margin:0;background:#fff;font-family:-apple-system,sans-serif;}body::before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(ellipse 60% 50% at 5% 10%,var(--wash-a) 0%,transparent 70%),radial-gradient(ellipse 50% 40% at 95% 85%,var(--wash-b) 0%,transparent 70%);}.col{max-width:240px;margin:0 auto;padding:40px 0;color:#111;}</style></head><body><div class="col"><h1 style="font-size:20px">Giang Nguyen</h1><p style="color:#444;font-size:13px">Scaled preview of the margin animation.</p></div><canvas id="bg-canvas" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;pointer-events:none;"></canvas><script>
/* Rotating interpretability backgrounds - v4 */
(function(){
  var cv=document.getElementById('bg-canvas');
  if(!cv) return;
  var cx=cv.getContext('2d');
  var W,H,cL,cR,V,frameNo=0;
  var CW=240,MP=20,MINM=30,GAP=21,PERIOD=4;

  var TH=[
    {id:'lineage',      pale:'186,178,224', dot:'96,56,222',  lab:'80,50,210',  a:'rgba(100,70,220,0.18)', b:'rgba(120,60,210,0.14)'},
    {id:'erasweep',     pale:'176,212,186', dot:'44,146,86',  lab:'30,118,68',  a:'rgba(60,162,96,0.16)',  b:'rgba(40,142,82,0.12)'},
    {id:'actmap',       pale:'226,186,196', dot:'204,60,96',  lab:'170,52,96',  a:'rgba(214,64,72,0.15)',  b:'rgba(48,96,210,0.13)',
     pos:'208,54,62', neg:'40,88,200'},
    {id:'rain',         pale:'236,214,164', dot:'196,138,28', lab:'166,112,18', a:'rgba(226,166,60,0.15)', b:'rgba(214,140,40,0.11)'},
    {id:'molecules',    pale:'158,206,206', dot:'16,146,152', lab:'12,116,122', a:'rgba(20,150,152,0.16)', b:'rgba(10,132,142,0.13)'}
  ];

  var EPOCH=Math.floor(Date.UTC(2026,7,8)/86400000);
  var qs=/[?&]bg=(\d+)/.exec(location.search);
  var slot=Math.floor((Math.floor(Date.now()/86400000)-EPOCH)/PERIOD);
  var VI=qs?(parseInt(qs[1],10)||0)%TH.length:((slot%TH.length)+TH.length)%TH.length;
  var T=TH[VI];

  var root=document.documentElement;
  if(root&&root.style&&root.style.setProperty){
    root.style.setProperty('--wash-a',T.a);
    root.style.setProperty('--wash-b',T.b);
  }

  function mix(c1,c2,k){
    var a=c1.split(','),b=c2.split(',');
    return Math.round(+a[0]+(+b[0]-+a[0])*k)+','+Math.round(+a[1]+(+b[1]-+a[1])*k)+','+Math.round(+a[2]+(+b[2]-+a[2])*k);
  }
  var RAMP=[];
  for(var ri=0;ri<7;ri++) RAMP.push(mix(T.pale,T.dot,ri/6));
  var MID=mix(T.pale,T.dot,0.42);
  var MIXRB=T.pos?mix(T.pos,T.neg,0.5):MID;

  function diamond(x,y,r){
    cx.beginPath();
    cx.moveTo(x,y-r);cx.lineTo(x+r,y);cx.lineTo(x,y+r);cx.lineTo(x-r,y);
    cx.closePath();
  }

  // Flat vocabulary, used by the free-form variants
  var KW=['LIME','SHAP','Shapley values','counterfactual','anchors','integrated gradients','saliency map',
    'DeepLIFT','LRP','occlusion sensitivity','GradCAM','class activation map','SmoothGrad',
    'partial dependence plot','feature interaction','surrogate model','RuleFit','decision rules',
    'influence function','nearest neighbors','prototype','criticisms','data shapley','TracIn',
    'adversarial examples','ProtoPNet','TCAV','concept bottleneck','concept vector','concept activation',
    'concept probing','sparse autoencoder','steering vector','linear probe','activation patch',
    'causal tracing','logit lens','superposition','monosemanticity','polysemanticity','circuit',
    'attention head','residual stream','feature attribution','representation engineering',
    'probing classifier','knowledge neuron','model editing','activation maximization',
    'feature visualization','faithfulness','plausibility','simulatability','human alignment',
    'model debugging','AI-assisted decision-making'];

  // [label, era 0-6 (old to new), side 0=left 1=right, position across margin, y offset]
  var ND=[
    ['Saliency Map',0,0,0.58,-10],['LRP',0,0,0.22,10],
    ['LIME',1,0,0.60,-10],['GradCAM',1,0,0.24,8],
    ['SHAP',2,0,0.58,-12],['DeepLIFT',2,0,0.22,0],['SmoothGrad',2,0,0.40,12],
    ['Integrated Grads',3,0,0.58,-12],['Anchors',3,0,0.22,6],
    ['Data Shapley',4,0,0.62,-10],['Influence Function',4,0,0.24,-2],['TracIn',4,0,0.44,12],
    ['Feature Attribution',5,0,0.22,-8],['Faithfulness',5,0,0.56,6],
    ['Model Debugging',6,0,0.24,-4],['Human Alignment',6,0,0.56,8],
    ['Feature Visualization',0,1,0.45,-8],
    ['Linear Probe',1,1,0.26,-10],['Prototypes',1,1,0.58,8],
    ['Probing Classifier',2,1,0.22,4],['TCAV',2,1,0.54,-12],
    ['Concept Bottleneck',3,1,0.24,-10],['Logit Lens',3,1,0.44,10],['ProtoPNet',3,1,0.62,-2],
    ['Activation Patch',4,1,0.22,6],['Circuit',4,1,0.56,-10],
    ['Superposition',5,1,0.22,2],['Causal Tracing',5,1,0.38,12],['Sparse Autoencoder',5,1,0.54,-12],
    ['Steering Vector',6,1,0.24,-4],['Steerling-8B \u2605',6,1,0.56,8]
  ];

  var LIN={
    'Saliency Map':['GradCAM','SmoothGrad'],'LRP':['DeepLIFT'],
    'LIME':['SHAP','Anchors'],'GradCAM':['SmoothGrad'],
    'SHAP':['Data Shapley','Integrated Grads'],'DeepLIFT':['Integrated Grads'],
    'SmoothGrad':['Integrated Grads'],'Integrated Grads':['Feature Attribution'],
    'Anchors':['Feature Attribution'],'Influence Function':['TracIn','Data Shapley'],
    'Data Shapley':['Feature Attribution'],'TracIn':['Feature Attribution'],
    'Feature Attribution':['Faithfulness','Model Debugging'],
    'Faithfulness':['Human Alignment','Model Debugging'],
    'Feature Visualization':['Prototypes','Linear Probe'],
    'Linear Probe':['Probing Classifier','TCAV'],'Prototypes':['ProtoPNet'],
    'Probing Classifier':['Logit Lens'],'TCAV':['Concept Bottleneck'],
    'Concept Bottleneck':['Steerling-8B \u2605'],'ProtoPNet':['Steerling-8B \u2605'],
    'Logit Lens':['Circuit'],'Circuit':['Superposition','Sparse Autoencoder'],
    'Activation Patch':['Causal Tracing'],'Superposition':['Sparse Autoencoder'],
    'Causal Tracing':['Steering Vector'],
    'Sparse Autoencoder':['Steering Vector','Steerling-8B \u2605']
  };

  function margins(){cL=Math.max(0,(W-CW)/2)-MP;cR=Math.min(W,(W+CW)/2)+MP;}

  function marginX(){
    var lw=cL,rw=W-cR;
    if(lw+rw<=0) return Math.random()*W;
    return Math.random()<lw/(lw+rw)?Math.random()*lw:cR+Math.random()*rw;
  }

  function label(txt,x,y,side,alpha,size,bold,pad,col){
    cx.save();
    cx.font=(bold?'600 ':'400 ')+size+'px "SF Mono","Fira Code",monospace';
    var w=cx.measureText(txt).width,lx,al;
    if(side===0){
      if(x-pad-w>6){lx=x-pad;al='right';}
      else if(x+pad+w<cL-6){lx=x+pad;al='left';}
      else if(w+16<cL){lx=8;al='left';}
      else{cx.restore();return;}
    }else{
      if(x+pad+w<W-6){lx=x+pad;al='left';}
      else if(x-pad-w>cR+6){lx=x-pad;al='right';}
      else if(w+16<W-cR){lx=W-8;al='right';}
      else{cx.restore();return;}
    }
    cx.textAlign=al;cx.textBaseline='middle';
    cx.fillStyle='rgba('+(col||T.lab)+','+alpha+')';
    cx.fillText(txt,lx,y);
    cx.restore();
  }

  // Shared era-graph geometry, used by the lineage and sweep variants
  var nodes=[],idx={},edges=[];
  function buildGraph(){
    nodes=[];idx={};edges=[];
    for(var i=0;i<ND.length;i++){
      var d=ND[i];
      nodes.push({label:d[0],era:d[1],side:d[2],xr:d[3],jy:d[4],x:0,y:0,actAt:0,actS:0,ph:Math.random()*6.2832});
      idx[d[0]]=i;
    }
    for(var k in LIN){
      var a=idx[k];
      if(a==null) continue;
      for(var j=0;j<LIN[k].length;j++){
        var b=idx[LIN[k][j]];
        if(b!=null&&nodes[b].side===nodes[a].side) edges.push([a,b]);
      }
    }
    placeGraph();
  }
  function placeGraph(){
    var i,s;
    for(i=0;i<nodes.length;i++){
      var n=nodes[i];
      n.x=n.side===0?n.xr*cL:cR+(1-n.xr)*(W-cR);
      n.y=(0.07+n.era/6*0.86)*H+n.jy;
    }
    for(s=0;s<2;s++){
      var col=[];
      for(i=0;i<nodes.length;i++) if(nodes[i].side===s) col.push(nodes[i]);
      col.sort(function(a,b){return a.y-b.y;});
      for(i=1;i<col.length;i++) if(col[i].y-col[i-1].y<GAP) col[i].y=col[i-1].y+GAP;
      var over=col.length?col[col.length-1].y-(H-16):0;
      if(over>0) for(i=0;i<col.length;i++) col[i].y-=over;
    }
  }

  // Variant 0: lineage cascades
  var lineage={
    pulses:[],roots:[],timer:0,
    init:function(){
      buildGraph();this.pulses=[];this.roots=[];
      for(var k in LIN) if(idx[k]!=null) this.roots.push(idx[k]);
      if(!this.timer) this.tick();
    },
    tick:function(){
      var self=this;
      if(this.roots.length) this.fire(this.roots[Math.floor(Math.random()*this.roots.length)],1,0);
      this.timer=setTimeout(function(){self.tick();},1500+Math.random()*900);
    },
    fire:function(i,s,depth){
      var n=nodes[i],self=this;
      if(!n) return;
      n.actAt=Date.now();n.actS=s;
      if(depth>=2) return;
      var kids=LIN[n.label];
      if(!kids||!kids.length) return;
      var pick=kids.slice().sort(function(){return Math.random()-0.5;}).slice(0,depth===0?2:1);
      for(var j=0;j<pick.length;j++){
        var b=idx[pick[j]];
        if(b==null) continue;
        if(nodes[b].side===n.side) this.pulses.push({a:i,b:b,t0:Date.now()});
        (function(t){setTimeout(function(){self.fire(t,s*0.7,depth+1);},430);})(b);
      }
    },
    draw:function(now,t){
      var i;
      for(i=0;i<edges.length;i++){
        var ea=nodes[edges[i][0]],eb=nodes[edges[i][1]];
        cx.beginPath();cx.strokeStyle='rgba('+RAMP[ea.era]+',0.13)';cx.lineWidth=0.8;
        cx.moveTo(ea.x,ea.y);cx.lineTo(eb.x,eb.y);cx.stroke();
      }
      for(i=this.pulses.length-1;i>=0;i--){
        var p=this.pulses[i],k=(now-p.t0)/430;
        if(k>=1){this.pulses.splice(i,1);continue;}
        var pa=nodes[p.a],pb=nodes[p.b],e=k*k*(3-2*k);
        var px=pa.x+(pb.x-pa.x)*e,py=pa.y+(pb.y-pa.y)*e;
        cx.beginPath();cx.strokeStyle='rgba('+RAMP[pa.era]+','+(0.45*(1-k))+')';cx.lineWidth=1.3;
        cx.moveTo(pa.x,pa.y);cx.lineTo(px,py);cx.stroke();
        cx.beginPath();cx.arc(px,py,2.4,0,6.2832);
        cx.fillStyle='rgba('+RAMP[pa.era]+',0.9)';cx.fill();
      }
      for(i=0;i<nodes.length;i++){
        var n=nodes[i],C=RAMP[n.era],star=n.label.indexOf('\u2605')>-1;
        var sp=n.actAt?Math.max(0,1-(now-n.actAt)/2200)*n.actS:0;
        var a=Math.max(sp,hover(n.x,n.y));
        var r=(star?4:2.1)+Math.sin(t*1.2+n.ph)*0.35+a*(star?5:3.4);
        if(a>0.04){
          cx.beginPath();cx.arc(n.x,n.y,r+4+(1-a)*12,0,6.2832);
          cx.strokeStyle='rgba('+C+','+a*0.45+')';cx.lineWidth=star?2.2:1.3;cx.stroke();
        }
        cx.beginPath();cx.arc(n.x,n.y,r,0,6.2832);
        cx.fillStyle='rgba('+C+','+((star?0.5:0.22)+a*0.78)+')';cx.fill();
        label(n.label,n.x,n.y,n.side,(star?0.42:0.2)+a*0.75,star?12:(a>0.35?10.5:9.5),a>0.35,r+6);
      }
    }
  };

  // Variant 1: chronological era sweep
  var erasweep={
    init:function(){buildGraph();},
    draw:function(now,t){
      var wf=(now%42000)/42000,i;
      function reach(era){var th=era/6;return wf<th?0:Math.min(1,(wf-th)/0.04);}
      function peak(era){
        var th=era/6,el=wf-th;
        if(el<0) return 0;
        return Math.min(1,el/0.04)*Math.max(0.26,1-Math.max(0,el-0.05)/0.09*0.74);
      }
      for(i=0;i<edges.length;i++){
        var ea=nodes[edges[i][0]],eb=nodes[edges[i][1]];
        var aa=Math.min(reach(ea.era),reach(eb.era));
        if(aa<0.05) continue;
        cx.beginPath();cx.strokeStyle='rgba('+RAMP[ea.era]+','+aa*0.2+')';cx.lineWidth=0.8;
        cx.moveTo(ea.x,ea.y);cx.lineTo(eb.x,eb.y);cx.stroke();
        var k=(now/1400+i*0.17)%1,px=ea.x+(eb.x-ea.x)*k,py=ea.y+(eb.y-ea.y)*k;
        cx.beginPath();cx.arc(px,py,1.8,0,6.2832);
        cx.fillStyle='rgba('+RAMP[ea.era]+','+aa*0.6+')';cx.fill();
      }
      for(i=0;i<nodes.length;i++){
        var n=nodes[i],C=RAMP[n.era],star=n.label.indexOf('\u2605')>-1;
        var na=reach(n.era);
        if(na<0.02) continue;
        var g=Math.max(peak(n.era),hover(n.x,n.y));
        var r=((star?5.5:3)+g*(star?5:3.2));
        if(g>0.3){
          diamond(n.x,n.y,r+5+(1-g)*13);
          cx.strokeStyle='rgba('+C+','+g*(star?0.5:0.3)+')';cx.lineWidth=star?2.4:1.2;cx.stroke();
        }
        diamond(n.x,n.y,r);
        cx.fillStyle='rgba('+C+','+(0.26+g*0.74)+')';cx.fill();
        label(n.label,n.x,n.y,n.side,g>0.5?g*0.95:na*0.3,star?12:(g>0.5?10.5:9),g>0.5,r+6);
      }
    }
  };

  // Variant 2: red/blue activation map that grows a concept network, then clears
  // Positions are stored per margin as fractions so a resize never restarts the cycle.
  var actmap={
    blobs:[],terms:[],links:[],pending:[],pool:[],phase:0,t0:0,next:0,N:12,
    px:function(side,fx){var lw=Math.max(0,cL),rw=Math.max(0,W-cR);return side===0?fx*lw:cR+fx*rw;},
    mw:function(side){return side===0?Math.max(0,cL):Math.max(0,W-cR);},
    init:function(){
      this.blobs=[];
      var lw=Math.max(0,cL),rw=Math.max(0,W-cR),tot=lw+rw||1;
      var n=Math.max(6,Math.min(14,Math.floor(tot/60)));
      for(var i=0;i<n;i++){
        var side=Math.random()<lw/tot?0:1;
        this.blobs.push({
          side:side,sign:Math.random()<0.5?1:-1,
          fx:Math.random(),fy:Math.random(),
          rf:0.28+Math.random()*0.2,
          ph:Math.random()*6.2832,
          sx:0.12+Math.random()*0.2,sy:0.09+Math.random()*0.18
        });
      }
      if(!this.terms.length) this.reset();
    },
    reset:function(){
      this.terms=[];this.links=[];this.pending=[];
      this.phase=0;this.t0=Date.now();this.next=Date.now()+500;
      this.pool=KW.slice().sort(function(){return Math.random()-0.5;});
    },
    place:function(){
      var side=this.terms.length%2;
      if(side===0&&this.mw(0)<90) side=1;
      if(side===1&&this.mw(1)<90) side=0;
      var best=null,bestD=-1;
      for(var k=0;k<16;k++){
        var fx=0.14+Math.random()*0.72,fy=0.07+Math.random()*0.86,md=1e9;
        for(var i=0;i<this.terms.length;i++){
          var q=this.terms[i];
          if(q.side!==side) continue;
          var dx=(q.fx-fx),dy=(q.fy-fy)*2.6,d=Math.sqrt(dx*dx+dy*dy);
          if(d<md) md=d;
        }
        if(md>bestD){bestD=md;best={fx:fx,fy:fy};}
      }
      this.terms.push({fx:best.fx,fy:best.fy,side:side,x:0,y:0,
        label:this.pool[this.terms.length%this.pool.length],
        sign:Math.random()<0.5?1:-1,born:Date.now()});
    },
    buildLinks:function(){
      var i,j;
      for(i=1;i<this.terms.length;i++){
        var n=this.terms[i],bi=-1,bd=1e9;
        for(j=0;j<i;j++){
          var m=this.terms[j];
          if(m.side!==n.side) continue;
          var dx=n.fx-m.fx,dy=n.fy-m.fy,d=Math.sqrt(dx*dx+dy*dy);
          if(d<bd){bd=d;bi=j;}
        }
        if(bi>=0) this.pending.push([i,bi]);
      }
      for(var k=0;k<4;k++){
        var p=Math.floor(Math.random()*this.terms.length),q=Math.floor(Math.random()*this.terms.length);
        if(p!==q&&this.terms[p].side===this.terms[q].side) this.pending.push([p,q]);
      }
      this.pending.sort(function(){return Math.random()-0.5;});
    },
    step:function(now){
      var guard=0;
      if(this.phase===0){
        // catch up when frames were throttled while the tab was hidden
        while(now>=this.next&&this.terms.length<this.N&&guard++<40){this.place();this.next+=850;}
        if(this.terms.length>=this.N){this.buildLinks();this.phase=1;this.next=now+400;}
      }else if(this.phase===1){
        while(now>=this.next&&this.pending.length&&guard++<40){
          var e=this.pending.shift();
          this.links.push({a:e[0],b:e[1],born:now});
          this.next+=270;
        }
        if(!this.pending.length){this.phase=2;this.t0=now;}
      }else if(this.phase===2){
        if(now-this.t0>2600){this.phase=3;this.t0=now;}
      }else if(now-this.t0>2000){this.reset();}
    },
    draw:function(now,t){
      var i,s;
      this.step(now);
      var fade=this.phase===3?Math.max(0,1-(now-this.t0)/2000):1;
      for(i=0;i<this.terms.length;i++){
        var tm=this.terms[i];
        tm.x=this.px(tm.side,tm.fx);tm.y=tm.fy*H;
      }
      // diverging heat field, clipped to the margins
      for(s=0;s<2;s++){
        var x0=s===0?0:cR+8,x1=s===0?cL-8:W;
        if(x1-x0<=4) continue;
        cx.save();cx.beginPath();cx.rect(x0,0,x1-x0,H);cx.clip();
        for(i=0;i<this.blobs.length;i++){
          var bl=this.blobs[i];
          if(bl.side!==s) continue;
          var C=bl.sign>0?T.pos:T.neg;
          var br=Math.max(42,Math.min(120,this.mw(s)*bl.rf));
          var bx=this.px(s,bl.fx)+Math.sin(t*bl.sx+bl.ph)*34;
          var by=bl.fy*H+Math.cos(t*bl.sy+bl.ph)*26;
          var g=cx.createRadialGradient(bx,by,0,bx,by,br);
          g.addColorStop(0,'rgba('+C+',0.10)');
          g.addColorStop(0.55,'rgba('+C+',0.04)');
          g.addColorStop(1,'rgba('+C+',0)');
          cx.fillStyle=g;cx.beginPath();cx.arc(bx,by,br,0,6.2832);cx.fill();
        }
        cx.restore();
      }
      for(i=0;i<this.links.length;i++){
        var L=this.links[i],A=this.terms[L.a],B=this.terms[L.b];
        if(!A||!B) continue;
        var k=Math.min(1,(now-L.born)/450),e=k*k*(3-2*k);
        var lc=A.sign===B.sign?(A.sign>0?T.pos:T.neg):MIXRB;
        cx.beginPath();cx.strokeStyle='rgba('+lc+','+0.26*fade+')';cx.lineWidth=0.9;
        cx.moveTo(A.x,A.y);cx.lineTo(A.x+(B.x-A.x)*e,A.y+(B.y-A.y)*e);cx.stroke();
      }
      for(i=0;i<this.terms.length;i++){
        var n=this.terms[i],NC=n.sign>0?T.pos:T.neg;
        var app=Math.min(1,(now-n.born)/650);
        var fresh=Math.max(0,1-(now-n.born)/1500);
        var gl=Math.max(hover(n.x,n.y),fresh*0.85),fv=fade*app;
        var r=2.4+gl*2.6;
        if(gl>0.05){
          cx.beginPath();cx.arc(n.x,n.y,r+4+(1-gl)*11,0,6.2832);
          cx.strokeStyle='rgba('+NC+','+gl*0.4*fv+')';cx.lineWidth=1.2;cx.stroke();
        }
        cx.beginPath();cx.arc(n.x,n.y,r,0,6.2832);
        cx.fillStyle='rgba('+NC+','+(0.5+gl*0.5)*fv+')';cx.fill();
        label(n.label,n.x,n.y,n.side,(0.42+gl*0.5)*fv,10,gl>0.35,r+7,NC);
      }
    }
  };

  // Variant 3: raindrops racing toward where interpretability is headed
  var rain={
    drops:[],splash:[],timer:0,FY:0,bright:[0,0],
    dest:['agentic interpretability','recursive interpretable intelligence'],
    init:function(){
      this.drops=[];this.splash=[];this.bright=[0,0];
      this.FY=H-58;
      var n=Math.max(10,Math.min(34,Math.floor((Math.max(0,cL)+Math.max(0,W-cR))/26)));
      for(var i=0;i<n;i++) this.drops.push(this.spawn(Math.random()*this.FY));
      if(!this.timer) this.tick();
    },
    spawn:function(y){
      var x=marginX();
      return {x:x,y:y,side:x>W/2?1:0,r:2+Math.random()*2.4,
        v:0.10+Math.random()*0.14,acc:0.00018+Math.random()*0.00022,hit:0,label:''};
    },
    tick:function(){
      var self=this;
      if(this.drops.length){
        var d=this.drops[Math.floor(Math.random()*this.drops.length)];
        d.hit=Date.now();d.label=KW[Math.floor(Math.random()*KW.length)];
      }
      this.timer=setTimeout(function(){self.tick();},1400+Math.random()*900);
    },
    draw:function(now){
      var i,s;
      for(s=0;s<2;s++){
        var x0=s===0?6:cR+6,x1=s===0?cL-6:W-6;
        if(x1-x0<70) continue;
        var lit=this.bright[s]?Math.max(0,1-(now-this.bright[s])/900):0;
        cx.save();
        cx.beginPath();cx.setLineDash([3,5]);
        cx.moveTo(x0,this.FY);cx.lineTo(x1,this.FY);
        cx.strokeStyle='rgba('+T.dot+','+(0.15+lit*0.3)+')';cx.lineWidth=1;cx.stroke();
        cx.setLineDash([]);
        cx.font='600 10.5px "SF Mono","Fira Code",monospace';
        var txt=this.dest[s],w=cx.measureText(txt).width;
        if(w<x1-x0-10){
          cx.textAlign='center';cx.textBaseline='middle';
          cx.fillStyle='rgba('+T.lab+','+(0.4+lit*0.5)+')';
          cx.fillText(txt,(x0+x1)/2,this.FY+19);
        }
        cx.restore();
      }
      for(i=0;i<this.drops.length;i++){
        var d=this.drops[i];
        var ig=d.hit?Math.max(0,1-(now-d.hit)/2000):0;
        var al=Math.max(ig,hover(d.x,d.y));
        var r=d.r+al*1.5,h=r*2.7;
        cx.beginPath();
        cx.arc(d.x,d.y,r,0,Math.PI);
        cx.quadraticCurveTo(d.x-r*0.92,d.y-h*0.52,d.x,d.y-h);
        cx.quadraticCurveTo(d.x+r*0.92,d.y-h*0.52,d.x+r,d.y);
        cx.closePath();
        cx.fillStyle='rgba('+(al>0.05?T.dot:MID)+','+(0.26+al*0.62)+')';
        cx.fill();
        if(al>0.05&&d.label) label(d.label,d.x,d.y,d.side,al*0.92,10.5,true,r+10);
        d.v+=d.acc;d.y+=d.v;
        if(d.y>=this.FY){
          this.splash.push({x:d.x,y:this.FY,t0:now});
          this.bright[d.side]=now;
          this.drops[i]=this.spawn(-14);
        }
      }
      for(i=this.splash.length-1;i>=0;i--){
        var sp=this.splash[i],k=(now-sp.t0)/700;
        if(k>=1){this.splash.splice(i,1);continue;}
        cx.beginPath();cx.arc(sp.x,sp.y,3+k*13,0,Math.PI,true);
        cx.strokeStyle='rgba('+T.dot+','+0.42*(1-k)+')';cx.lineWidth=1;cx.stroke();
      }
    }
  };

  // Variant 4: drifting molecules
  var molecules={
    ms:[],timer:0,
    init:function(){
      this.ms=[];
      var lw=Math.max(0,cL),rw=Math.max(0,W-cR),tot=lw+rw||1;
      var n=Math.max(4,Math.min(11,Math.floor(tot/85)));
      var sh=KW.slice().sort(function(){return Math.random()-0.5;});
      for(var i=0;i<n;i++){
        var side=Math.random()<lw/tot?0:1;
        var atoms=[],bonds=[],j;
        if(Math.random()<0.38){
          var k=6,rad=19+Math.random()*11;
          for(j=0;j<k;j++){
            atoms.push({a:j/k*6.2832,d:rad,r:2.3});
            bonds.push({a:j,b:(j+1)%k,dbl:j%2===0});
          }
        }else{
          atoms.push({a:0,d:0,r:3.6});
          var k2=3+Math.floor(Math.random()*3);
          for(j=0;j<k2;j++){
            atoms.push({a:j/k2*6.2832+Math.random()*0.6,d:17+Math.random()*15,r:2.2});
            bonds.push({a:0,b:j+1,dbl:Math.random()<0.28});
          }
        }
        var rr=0;
        for(j=0;j<atoms.length;j++) rr=Math.max(rr,atoms[j].d+6);
        this.ms.push({side:side,rad:rr,
          x:side===0?Math.random()*lw:cR+Math.random()*rw,y:Math.random()*H,
          vx:(Math.random()-0.5)*0.17,vy:(Math.random()-0.5)*0.17,
          rot:Math.random()*6.2832,rv:(Math.random()-0.5)*0.005,
          atoms:atoms,bonds:bonds,label:sh[i%sh.length],actAt:0});
      }
      if(!this.timer) this.tick();
    },
    tick:function(){
      var self=this;
      if(this.ms.length) this.ms[Math.floor(Math.random()*this.ms.length)].actAt=Date.now();
      this.timer=setTimeout(function(){self.tick();},1200+Math.random()*700);
    },
    clamp:function(m){
      var lo=m.rad,hi=m.side===0?cL-m.rad-8:W-m.rad;
      if(m.side===1) lo=cR+m.rad+8;
      if(hi<lo){m.x=(lo+hi)/2;m.vx=-m.vx;}
      else{
        if(m.x<lo){m.x=lo;m.vx=Math.abs(m.vx);}
        if(m.x>hi){m.x=hi;m.vx=-Math.abs(m.vx);}
      }
      if(m.y<m.rad){m.y=m.rad;m.vy=Math.abs(m.vy);}
      if(m.y>H-m.rad){m.y=H-m.rad;m.vy=-Math.abs(m.vy);}
    },
    draw:function(now){
      for(var i=0;i<this.ms.length;i++){
        var m=this.ms[i],j,o;
        var act=m.actAt?Math.max(0,1-(now-m.actAt)/2200):0;
        var al=Math.max(act,hover(m.x,m.y));
        var pos=[];
        for(j=0;j<m.atoms.length;j++){
          var at=m.atoms[j],an=at.a+m.rot;
          pos.push({x:m.x+Math.cos(an)*at.d,y:m.y+Math.sin(an)*at.d,r:at.r});
        }
        for(j=0;j<m.bonds.length;j++){
          var bd=m.bonds[j],p1=pos[bd.a],p2=pos[bd.b];
          var dx=p2.x-p1.x,dy=p2.y-p1.y,L=Math.sqrt(dx*dx+dy*dy)||1;
          var nx=-dy/L,ny=dx/L,offs=bd.dbl?[-1.8,1.8]:[0];
          cx.strokeStyle='rgba('+T.dot+','+(0.22+al*0.5)+')';cx.lineWidth=0.9;
          for(o=0;o<offs.length;o++){
            cx.beginPath();
            cx.moveTo(p1.x+nx*offs[o],p1.y+ny*offs[o]);
            cx.lineTo(p2.x+nx*offs[o],p2.y+ny*offs[o]);
            cx.stroke();
          }
        }
        for(j=0;j<pos.length;j++){
          var p=pos[j],pr=p.r+al*1.8;
          if(al>0.05){
            cx.beginPath();cx.arc(p.x,p.y,pr+3+(1-al)*8,0,6.2832);
            cx.strokeStyle='rgba('+T.dot+','+al*0.28+')';cx.lineWidth=1;cx.stroke();
          }
          cx.beginPath();cx.arc(p.x,p.y,pr,0,6.2832);
          cx.fillStyle='rgba('+T.dot+','+(0.34+al*0.6)+')';cx.fill();
        }
        if(al>0.05) label(m.label,m.x,m.y,m.side,al*0.95,10.5,true,m.rad+9);
        m.x+=m.vx;m.y+=m.vy;m.rot+=m.rv;this.clamp(m);
      }
    }
  };

  var VARIANTS=[lineage,erasweep,actmap,rain,molecules];
  V=VARIANTS[VI];

  var mx=-1e4,my=-1e4;
  function hover(x,y){
    var dx=x-mx,dy=y-my,d=Math.sqrt(dx*dx+dy*dy);
    return d<130?(1-d/130)*0.9:0;
  }

  function resize(){
    W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;
    margins();
    if(cL>=MINM) V.init();
  }

  function frame(){
    frameNo++;
    cx.clearRect(0,0,W,H);
    if(cL>=MINM) V.draw(Date.now(),Date.now()*0.001);
    requestAnimationFrame(frame);
  }

  window.addEventListener('mousemove',function(e){mx=e.clientX;my=e.clientY;});
  window.addEventListener('mouseout',function(){mx=-1e4;my=-1e4;});
  window.addEventListener('resize',resize);
  resize();frame();
})();

</script></body></html>
