<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | default: '' | strip_html | normalize_whitespace | truncate: 160 | escape }}">
  <link rel="icon" type="image/png" href="{{ '/assets/images/favicon.png' | relative_url }}">
  {% if page.redirect_to %}<meta http-equiv="refresh" content="0; url={{ page.redirect_to }}">{% endif %}
  <style>
    /* subtle purple gradient wash behind everything */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(ellipse 60% 50% at 5% 10%,  rgba(100, 70, 220, 0.18) 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 95% 85%, rgba(120, 60, 210, 0.14) 0%, transparent 70%);
      pointer-events: none;
    }
  </style>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.65;
      color: #111;
      background: #fff;
      margin: 0;
      padding: 0;
    }

    .page-wrap {
      max-width: 680px;
      margin: 0 auto;
      padding: 3rem 1.25rem 5rem;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin: 0 0 0.2rem;
      color: #000;
      letter-spacing: -0.02em;
    }

    h2 {
      font-size: 0.95rem;
      font-weight: 700;
      margin: 0 0 0.75rem;
      color: #000;
      text-transform: lowercase;
      letter-spacing: 0.01em;
    }

    p { margin: 0.6rem 0; color: #444; }

    a { color: #0066cc; text-decoration: none; }
    a:hover { text-decoration: underline; }

    hr {
      border: none;
      border-top: 1px solid #eaeaea;
      margin: 2.25rem 0;
    }

    ul {
      margin: 0.4rem 0;
      padding-left: 1.2rem;
      color: #444;
    }

    li { margin: 0.35rem 0; }

    strong { color: #111; }

    /* Links row */
    .links {
      font-size: 0.88rem;
      margin-bottom: 2rem;
      color: #888;
    }

    .links a { color: #0066cc; }
    .links .sep { margin: 0 0.4rem; color: #ddd; }

    /* Profile block with photo */
    .profile {
      display: flex;
      gap: 1.5rem;
      align-items: flex-start;
      margin-bottom: 0.5rem;
    }

    .profile img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 6px;
      flex-shrink: 0;
    }

    .profile p:first-child { margin-top: 0; }

    /* Timeline entries */
    .entry {
      display: flex;
      gap: 1.25rem;
      margin-bottom: 1.25rem;
      align-items: flex-start;
    }

    .entry-period {
      font-size: 0.78rem;
      font-weight: 600;
      color: #bbb;
      width: 90px;
      flex-shrink: 0;
      padding-top: 0.15rem;
    }

    .entry-body { flex: 1; }

    .entry-title { font-weight: 600; color: #111; }
    .entry-sub { color: #666; font-size: 0.92rem; }

    .entry-logo {
      display: inline-block;
      height: 18px;
      width: auto;
      vertical-align: middle;
      margin-right: 0.4rem;
      object-fit: contain;
      filter: grayscale(30%);
      opacity: 0.85;
    }

    .entry-detail {
      margin-top: 0.35rem;
      font-size: 0.9rem;
      color: #555;
    }

    .entry-detail ul { margin: 0.3rem 0; padding-left: 1.1rem; }
    .entry-detail li { margin: 0.25rem 0; }

    /* Publications */
    .pub {
      margin-bottom: 0.8rem;
      font-size: 0.91rem;
      color: #444;
      line-height: 1.5;
    }

    .pub-venue {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 700;
      color: #666;
      background: #f2f2f2;
      padding: 0.1rem 0.4rem;
      border-radius: 3px;
      margin-right: 0.3rem;
      vertical-align: middle;
    }

    /* Back link for sub-pages */
    .back {
      font-size: 0.88rem;
      color: #888;
      margin-bottom: 2rem;
      display: block;
    }

    /* Footer */
    .page-footer {
      color: #ccc;
      font-size: 0.8rem;
      margin-top: 2.5rem;
      border-top: 1px solid #f5f5f5;
      padding-top: 1.25rem;
    }

    @media (max-width: 500px) {
      .profile { flex-direction: column; }
      .profile img { width: 75px; height: 75px; }
      h1 { font-size: 1.4rem; }
      .entry { flex-direction: column; gap: 0.15rem; }
      .entry-period { width: auto; }
    }
  </style>
</head>
<body>
<div class="page-wrap">
  {{ content }}
</div>
<canvas id="bg-canvas" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;pointer-events:none;"></canvas>
<script>
(function () {
  var canvas = document.getElementById('bg-canvas');
  var ctx = canvas.getContext('2d');
  var particles = [], W, H, cLeft, cRight;

  var COLOR     = '90, 65, 220';
  var MAX_DIST  = 180;
  var CONTENT_W = 720;
  var MARGIN_PAD = 24;

  var CONCEPTS = [
    // local model-agnostic methods
    'LIME', 'SHAP', 'Shapley values', 'counterfactual', 'anchors',
    'integrated gradients', 'saliency map', 'DeepLIFT', 'LRP',
    'occlusion sensitivity', 'GradCAM', 'class activation map',
    'SmoothGrad', 'input × gradient',
    // global model-agnostic methods
    'partial dependence plot', 'feature interaction',
    'surrogate model', 'RuleFit', 'decision rules',
    // example-based
    'influence function', 'nearest neighbors', 'prototype', 'criticisms',
    'data shapley', 'TracIn', 'adversarial examples', 'ProtoPNet',
    // concept-based
    'TCAV', 'concept bottleneck', 'concept vector', 'concept activation',
    'concept probing',
    // mechanistic interpretability
    'sparse autoencoder', 'steering vector', 'linear probe', 'activation patch',
    'causal tracing', 'logit lens', 'superposition', 'monosemanticity',
    'polysemanticity', 'circuit', 'attention head', 'residual stream',
    'feature attribution', 'representation engineering', 'probing classifier',
    // model editing & control
    'knowledge neuron', 'model editing',
    'activation maximization', 'feature visualization',
    // evaluation & application
    'faithfulness', 'plausibility', 'simulatability', 'human alignment',
    'model debugging', 'AI-assisted decision-making',
  ];

  // activation fade duration in ms
  var FADE_MS = 1800;

  function margins() {
    cLeft  = Math.max(0, (W - CONTENT_W) / 2) - MARGIN_PAD;
    cRight = Math.min(W, (W + CONTENT_W) / 2) + MARGIN_PAD;
  }

  function randInMargin() {
    var lw = cLeft, rw = W - cRight;
    if (lw + rw <= 0) return Math.random() * W;
    if (Math.random() < lw / (lw + rw)) {
      return Math.random() * lw;
    } else {
      return cRight + Math.random() * rw;
    }
  }

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
    margins();
    initParticles();
  }

  function initParticles() {
    particles = [];
    var marginArea = Math.max(0, cLeft) * H + Math.max(0, W - cRight) * H;
    var n = Math.min(CONCEPTS.length, Math.max(10, Math.floor(marginArea / 9000)));
    // shuffle concepts so each particle gets a unique one
    var shuffled = CONCEPTS.slice().sort(function() { return Math.random() - 0.5; });
    for (var i = 0; i < n; i++) {
      particles.push({
        x:       randInMargin(),
        y:       Math.random() * H,
        vx:      (Math.random() - 0.5) * 0.28,
        vy:      (Math.random() - 0.5) * 0.28,
        r:       Math.random() * 2.0 + 0.8,
        pulse:   Math.random() * Math.PI * 2,
        label:   shuffled[i % shuffled.length],
        // activation state: actAt = timestamp when spark fired, 0 = idle
        actAt:   0
      });
    }
  }

  function clampToMargin(p) {
    if (p.x < 0)  { p.x = 0;  p.vx =  Math.abs(p.vx); }
    if (p.x > W)  { p.x = W;  p.vx = -Math.abs(p.vx); }
    if (p.y < 0)  { p.y = 0;  p.vy =  Math.abs(p.vy); }
    if (p.y > H)  { p.y = H;  p.vy = -Math.abs(p.vy); }
    if (p.x > cLeft && p.x < cRight) {
      var mid = (cLeft + cRight) / 2;
      if (p.x < mid) { p.x = cLeft; p.vx = -Math.abs(p.vx); }
      else           { p.x = cRight; p.vx =  Math.abs(p.vx); }
    }
  }

  // fire a random concept every ~1 second
  function spark() {
    if (particles.length === 0) return;
    var idx = Math.floor(Math.random() * particles.length);
    particles[idx].actAt = Date.now();
    setTimeout(spark, 900 + Math.random() * 400);
  }

  function frame() {
    ctx.clearRect(0, 0, W, H);
    var t   = Date.now() * 0.001;
    var now = Date.now();

    // draw edges
    for (var i = 0; i < particles.length; i++) {
      var a = particles[i];
      for (var j = i + 1; j < particles.length; j++) {
        var b = particles[j];
        var dx = a.x - b.x, dy = a.y - b.y;
        var d  = Math.sqrt(dx * dx + dy * dy);
        if (d < MAX_DIST) {
          ctx.beginPath();
          ctx.strokeStyle = 'rgba(' + COLOR + ',' + (0.25 * (1 - d / MAX_DIST)) + ')';
          ctx.lineWidth   = 0.8;
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
      }
    }

    // draw nodes + labels
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];

      var elapsed = (p.actAt > 0) ? (now - p.actAt) : FADE_MS;
      // t01: 1 at spark, fades to 0 over FADE_MS
      var t01 = Math.max(0, 1 - elapsed / FADE_MS);

      // base dot
      var pr = p.r + Math.sin(t * 1.3 + p.pulse) * 0.5;
      var dotR = pr + t01 * 5;          // swell on activation
      var dotA = 0.38 + t01 * 0.62;    // base opacity -> full

      ctx.beginPath();
      ctx.arc(p.x, p.y, dotR, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(' + COLOR + ',' + dotA + ')';
      ctx.fill();

      // glow ring on activation
      if (t01 > 0.01) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, dotR + 4 + (1 - t01) * 10, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(' + COLOR + ',' + (t01 * 0.5) + ')';
        ctx.lineWidth   = 1.5;
        ctx.stroke();

        // concept label
        ctx.save();
        ctx.font        = '600 10.5px "SF Mono", "Fira Code", monospace';
        ctx.fillStyle   = 'rgba(80,50,210,' + (t01 * 0.95) + ')';
        ctx.textBaseline = 'middle';
        // place label on the side with more space
        var onLeft = p.x > W / 2;
        if (onLeft) {
          ctx.textAlign = 'right';
          ctx.fillText(p.label, p.x - dotR - 7, p.y);
        } else {
          ctx.textAlign = 'left';
          ctx.fillText(p.label, p.x + dotR + 7, p.y);
        }
        ctx.restore();
      }

      p.x += p.vx;
      p.y += p.vy;
      clampToMargin(p);
    }

    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', function () { resize(); });
  resize();
  spark();
  frame();
})();
</script>
</body>
</html>
